name: Apply auth configuration

# Enables the custom access-token hook, sets the access-token lifetime, and
# configures the reviewed Google OAuth/redirect boundary on the Cloud project.
# Manual only, for the same reason the seed is (ADR-034): this is configuration
# of a live project, not part of the forward-only migration stream.
#
# WHY NOT `supabase config push`, which exists in CLI 2.110.0 and is the obvious
# tool: it pushes the WHOLE of supabase/config.toml — 414 lines of Supabase's
# local-development defaults, including site_url = "http://127.0.0.1:3000", the
# local SMTP block, and storage and realtime sections that have never been
# reconciled against what this project actually has. There is no --dry-run.
# Enabling one hook that way would silently set a production project's site URL
# to localhost and break every email link. So this patches only the reviewed
# hook, expiry, site, redirect and Google-provider fields and touches nothing
# else. supabase/config.toml carries the local equivalents as the repo's record
# of intent — not as the mechanism that sets production.
#
# ORDERING: the hook must not be enabled before the migration that creates
# app.custom_access_token_hook has been applied. A Postgres auth hook fails
# closed — if Auth is pointed at a function that does not exist, token issuance
# raises and NOBODY CAN SIGN IN. Run this only after db.yml's migrate job is
# green for that migration. The step below checks the function exists first and
# refuses to patch if it does not, so the ordering does not rest on memory.
#
#   gh workflow run auth-config.yml -R OGUN01/gymloop
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_REF: pecxrpskmfeuyzngvewq
  # pg-functions://<database>/<schema>/<function>. The schema is `app`, not
  # `public`: config.toml exposes only public and graphql_public to the Data
  # API and packages/db/types/database.ts is generated from public, so a hook
  # in public would be a PostgREST RPC and a permanent schema-drift diff.
  HOOK_URI: pg-functions://postgres/app/custom_access_token_hook
  # 15 minutes. The default is 3600. This number is the ceiling on how long a
  # revoked privilege keeps working: deactivating a user deletes their
  # auth.sessions rows, which kills the refresh token, but the access token
  # already in hand stays valid until it expires. The trade is that every
  # refresh executes the hook, so this is a load decision as well as a security
  # one — four refreshes per user per hour rather than one.
  JWT_EXP: 900
  SITE_URL: https://gymloop-phi.vercel.app
  URI_ALLOW_LIST: https://gymloop-phi.vercel.app/auth/callback,http://127.0.0.1:3000/auth/callback,gymloop://auth/callback

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: 2.110.0 }
      - name: Link the approved Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --yes

      - name: Refuse to enable a hook whose function does not exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # The check asks for a sentinel word rather than a number, because the
          # CLI's output format is not stable across environments: locally it
          # emits JSON, on this runner it draws an ASCII table. The first version
          # grepped for '"hook_exists": 1' and so reported the hook missing when
          # it was plainly there. A guard whose failure message is false is worse
          # than no guard. A word survives every renderer.
          supabase db query --linked \
            "select case when exists (
                      select 1 from pg_proc p
                        join pg_namespace n on n.oid = p.pronamespace
                       where n.nspname = 'app'
                         and p.proname = 'custom_access_token_hook')
                    then 'HOOK_PRESENT' else 'HOOK_ABSENT' end as status;" | tee /tmp/hook.out
          grep -q 'HOOK_PRESENT' /tmp/hook.out || {
            echo "::error::app.custom_access_token_hook does not exist on $PROJECT_REF."
            echo "::error::Enabling the hook now would fail token issuance for every user."
            echo "::error::Apply the migration first and wait for db.yml to be green."
            exit 1
          }

      - name: Patch the reviewed auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          case "$GOOGLE_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo "::error::Google client id has an unexpected shape."; exit 1 ;;
          esac
          payload=$(jq -n \
            --arg hook_uri "$HOOK_URI" \
            --arg site_url "$SITE_URL" \
            --arg uri_allow_list "$URI_ALLOW_LIST" \
            --arg google_client_id "$GOOGLE_CLIENT_ID" \
            --arg google_client_secret "$GOOGLE_CLIENT_SECRET" \
            --argjson jwt_exp "$JWT_EXP" \
            '{hook_custom_access_token_enabled: true,
              hook_custom_access_token_uri: $hook_uri,
              jwt_exp: $jwt_exp,
              site_url: $site_url,
              uri_allow_list: $uri_allow_list,
              external_google_enabled: true,
              external_google_client_id: $google_client_id,
              external_google_secret: $google_client_secret}')
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "HTTP $code"
          # The response echoes the whole auth config, including secrets. Print
          # only reviewed non-secret fields and boolean presence checks.
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/auth.json'))
          if isinstance(d, dict) and 'message' in d and len(d) <= 2:
              print('API said:', d['message'])
          else:
              for k in ('hook_custom_access_token_enabled',
                        'hook_custom_access_token_uri', 'jwt_exp', 'site_url',
                        'uri_allow_list', 'external_google_enabled'):
                  print(f'{k} = {d.get(k, "<absent>")}')
              print('external_google_client_id_present =', bool(d.get('external_google_client_id')))
              print('external_google_secret_present =', bool(d.get('external_google_secret')))
          PY
          # A known unknown, recorded rather than assumed away: an open Supabase
          # issue reports this endpoint refusing a send_email hook with "Auth
          # Hooks can only be configured on Team or Enterprise Plans", on a
          # project where the Dashboard had already enabled it. Whether the same
          # gate applies to hook_custom_access_token_* is not established. If
          # that is the message above, the fallback is the Dashboard toggle done
          # once by the owner and recorded — never a wholesale `config push`.
          [ "$code" = "200" ]
