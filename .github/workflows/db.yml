name: DB

on:
  push:
    branches: [main]
  pull_request:

# Database strategy (docs/decisions.md ADR-030): one Supabase Cloud project,
# no Docker, no branching. Migrations are applied by CI only, on merge to
# main, in merge order — never by a session and never during fan-out. The
# drift check and pgTAP run AFTER that apply. On a pull request nothing is
# applied; a PR that adds migrations gets a dry-run only, and its drift /
# pgTAP verification happens on the post-merge run of main.
concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: false

env:
  # The access token alone does work — the CLI mints a temporary login role
  # through the Management API (POST /v1/projects/{ref}/cli/login-role) — but
  # that role has a connection ceiling around twenty, and `pg_prove` opens one
  # connection per test file, so the tail of the suite would fail to connect
  # at all (docs/decisions.md ADR-048). With the password set the CLI connects
  # as `postgres` directly, on a stable credential, and the ceiling is gone.
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PROJECT_REF: pecxrpskmfeuyzngvewq

jobs:
  # Every pgTAP file must be wrapped BEGIN ... ROLLBACK — the suite runs
  # against the shared Cloud database, so a test that commits is a bug
  # (ADR-030). Runs first and needs no credentials.
  pgtap-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-pgtap-rollback.mjs

  migrate:
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: supabase/setup-cli@v3
        with: { version: 2.110.0 }
      - name: Did this change add or edit migrations?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          if git diff --name-only "$range" -- supabase/migrations 2>/dev/null | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # Nothing to link or push until the first migration exists.
      - name: Are there any migrations?
        id: has
        run: |
          if [ -n "$(find supabase/migrations -name '*.sql' 2>/dev/null)" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migrations yet (schema is Phase 1). Nothing to apply."
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
      # A fresh checkout has no link state (supabase/.temp/ is gitignored).
      - if: steps.has.outputs.any == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --yes
      - name: Dry run (pull request — applies nothing)
        if: steps.has.outputs.any == 'true' && github.event_name == 'pull_request'
        run: supabase db push --linked --dry-run
      - name: Apply migrations (merge to main, in merge order)
        if: steps.has.outputs.any == 'true' && github.event_name == 'push'
        run: supabase db push --linked

  # Compared against Cloud after `migrate`, so a merged migration and its
  # regenerated types are checked as a pair. Skipped on a PR that changes
  # migrations — Cloud cannot yet reflect them — and verified on main instead.
  schema-drift:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name == 'pull_request' && needs.migrate.outputs.migrations_changed == 'true'
        run: echo "::notice::PR changes supabase/migrations; drift is verified on the post-merge run of main (ADR-030)."
      - if: github.event_name == 'push' || needs.migrate.outputs.migrations_changed == 'false'
        uses: supabase/setup-cli@v3
        with: { version: 2.110.0 }
      - if: github.event_name == 'push' || needs.migrate.outputs.migrations_changed == 'false'
        name: Generate types from Cloud and diff against committed
        run: |
          supabase gen types typescript --project-id "$PROJECT_REF" > /tmp/fresh.ts
          grep -v '^[[:space:]]*//' /tmp/fresh.ts | grep -v '^[[:space:]]*$' > /tmp/fresh.stripped.ts
          grep -v '^[[:space:]]*//' packages/db/types/database.ts | grep -v '^[[:space:]]*$' > /tmp/committed.stripped.ts
          if ! diff -u /tmp/committed.stripped.ts /tmp/fresh.stripped.ts; then
            echo "::error::packages/db/types/database.ts is out of date. Regenerate with: supabase gen types typescript --linked > packages/db/types/database.ts"
            exit 1
          fi
          echo "packages/db/types/database.ts matches the schema."

  # The seed, run end to end inside BEGIN ... ROLLBACK, so it is proved to
  # still work against the schema this push just applied -- without writing a
  # single row.
  #
  # It exists because a change to `supabase/seed.sql` shipped with a syntax
  # error that no gate could see: the statements were verified in isolation
  # and not in place, and they had been spliced between a CTE and the INSERT
  # it belonged to. `supabase db query` parses the whole file before running
  # any of it, so one dry run catches every error of that class at once.
  #
  # It also catches the reverse and more dangerous direction: a MIGRATION that
  # breaks the seed. That failure is silent until somebody tries to rebuild the
  # demo gym, which is precisely when they most need it to work.
  #
  # `workflow_dispatch` on seed.yml stays the only thing that COMMITS a seed
  # (ADR-034, OPEN-006). This never commits, and shares db.yml's concurrency
  # group so it cannot overlap a real seed or a migration.
  # `needs: pgtap`, NOT `needs: migrate`, and that distinction cost a red CI run.
  #
  # Run in parallel with the suite, this job holds locks across nearly every
  # table for the length of one transaction while `pg_prove` runs 45 files
  # against the same Cloud project — and it deadlocked
  # `h14_impersonation_and_revocation_holdout`, which then reported "planned 58
  # but ran 28". A deadlock is not a defect in either party; it is two correct
  # transactions wanting the same rows in the opposite order.
  #
  # `db.yml`'s `concurrency` group only serialises WORKFLOWS. Two jobs inside
  # one workflow run concurrently by default, which is exactly the thing that
  # group cannot protect against.
  seed-dry-run:
    needs: [migrate, pgtap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name == 'pull_request' && needs.migrate.outputs.migrations_changed == 'true'
        run: echo "::notice::PR changes supabase/migrations; the seed is dry-run on the post-merge run of main (ADR-030)."
      - if: github.event_name == 'push' || needs.migrate.outputs.migrations_changed == 'false'
        uses: supabase/setup-cli@v3
        with: { version: 2.110.0 }
      - if: github.event_name == 'push' || needs.migrate.outputs.migrations_changed == 'false'
        run: supabase link --project-ref "$PROJECT_REF" --yes
      - if: github.event_name == 'push' || needs.migrate.outputs.migrations_changed == 'false'
        name: Run the seed in a transaction and roll it back
        # Both files, in ONE transaction and in the order seed.yml runs them:
        # seed-scenarios.sql depends on the demo gym seed.sql creates, so
        # dry-running it alone would prove nothing about the pair.
        run: |
          { echo 'begin;'
            cat supabase/seed.sql
            echo
            cat supabase/seed-scenarios.sql
            echo
            echo "select 'seed and scenarios ran clean against this schema, nothing committed' as verdict;"
            echo 'rollback;'
          } > /tmp/seed_dry.sql
          supabase db query --linked -f /tmp/seed_dry.sql

  # Full pgTAP suite against the Cloud project, after the apply, never
  # concurrently with another merge (see `concurrency` above). Every file is
  # rollback-wrapped, enforced by `pgtap-rollback`. Same PR skip rule as drift.
  pgtap:
    needs: [migrate, pgtap-rollback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Decide whether the suite can run here
        id: check
        run: |
          if [ -z "$(find supabase/tests -name '*.sql' 2>/dev/null)" ]; then
            echo "No pgTAP tests yet (schema is Phase 1 — docs/gates.md gates 6-11). Nothing to run."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.migrate.outputs.migrations_changed }}" = "true" ]; then
            echo "::notice::PR changes supabase/migrations; pgTAP runs on the post-merge run of main (ADR-030)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The suite costs ~700 wallclock seconds and, until now, ran on every
          # push to main including documentation-only ones. Skip it when the
          # push provably changed nothing that can affect the database or the
          # suite — and DEFAULT TO RUNNING whenever that cannot be established,
          # because the house rule here is fail closed: a green run that did
          # not run the suite is the jammed gate docs/gates.md was burned by.
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ]              || [ "$before" = "0000000000000000000000000000000000000000" ]              || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "::notice::Cannot compute a diff for this event; running the suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(supabase/|packages/db/|scripts/check-pgtap-rollback|\.github/workflows/db\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This push touches no migration, no pgTAP file, no generated types and not this workflow. Skipping the suite (~700s)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # The anti-gaming half of the suite (AGENTS.md hard rule #10). The
      # holdout files are written blind by an author that reads neither the
      # visible suite nor the implementation, and run against the same database
      # in the same job — same rollback rule, same verdict. They lived in a
      # separate private repo until ADR-060 moved them here: hard rule 10
      # already stops an implementer reading them, so the second repository was
      # buying nothing over the second author while costing a push per round
      # and — the expensive part — the orchestrator's ability to read a failing
      # file, which turned every red holdout assertion into a round trip.
      #
      # Fail closed, not open. A holdout suite that silently isn't there is
      # exactly the jammed gate docs/gates.md was burned by in Phase 0: the job
      # goes green having run half of what it claims to run.
      - name: Holdout files exist and are rollback-wrapped too (ADR-030)
        id: paths
        if: steps.check.outputs.run == 'true'
        run: |
          if [ -z "$(find supabase/tests-holdout -name '*.sql' 2>/dev/null)" ]; then
            echo "::error::The visible pgTAP suite has files but supabase/tests-holdout has no *.sql. The holdout half of the suite is not running."
            exit 1
          fi
          echo "dirs=supabase/tests supabase/tests-holdout" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.run == 'true'
        uses: supabase/setup-cli@v3
        with: { version: 2.110.0 }
      - if: steps.check.outputs.run == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --yes
      # One invocation again. It was split three ways while the CLI had to mint
      # a temporary login role per connection (ADR-048); with a stable
      # SUPABASE_DB_PASSWORD the CLI connects as `postgres` and the ceiling
      # that forced the split is gone.
      - if: steps.check.outputs.run == 'true'
        run: supabase test db --linked ${{ steps.paths.outputs.dirs }}
