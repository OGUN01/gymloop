name: DB

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: 2.110.0 }
      - name: Start local Supabase
        run: supabase start
      # Compared against the LOCAL stack (docs/decisions.md ADR-024), not
      # --linked against the remote — hermetic, and asserts the actual
      # invariant: committed migrations and committed types agree. --linked
      # and --local emit genuinely different template output even against an
      # identical schema (verified: a PostgREST-version-dependent
      # __InternalSupabase block, different conditional-type parenthesization
      # — not a CLI version mismatch, both sides pinned to the same version),
      # so the committed file must itself be generated with --local. Comment
      # and blank lines are stripped from both sides before comparing, since
      # the committed file carries a "generated, do not edit" header that
      # `supabase gen types` itself never produces.
      - name: Generate types from the local stack and diff against committed
        run: |
          supabase gen types typescript --local > /tmp/fresh.ts
          grep -v '^[[:space:]]*//' /tmp/fresh.ts | grep -v '^[[:space:]]*$' > /tmp/fresh.stripped.ts
          grep -v '^[[:space:]]*//' packages/db/types/database.ts | grep -v '^[[:space:]]*$' > /tmp/committed.stripped.ts
          if ! diff -u /tmp/committed.stripped.ts /tmp/fresh.stripped.ts; then
            echo "::error::packages/db/types/database.ts is out of date. Regenerate with (after 'supabase start'): supabase gen types typescript --local > packages/db/types/database.ts"
            exit 1
          fi
          echo "packages/db/types/database.ts matches the schema."

  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: 2.110.0 }
      - name: Start local Supabase
        run: supabase start
      - name: Run pgTAP suite
        run: |
          if [ -z "$(find supabase/tests -name '*.sql' 2>/dev/null)" ]; then
            echo "No pgTAP tests yet (schema is Phase 1 — docs/gates.md gates 6-11). Nothing to run."
            exit 0
          fi
          supabase test db
